name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Tests + Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -e .

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Run tests
        run: python -m pytest tests -q --tb=short

      - name: Build and smoke-test wheel
        run: |
          python -m pip wheel --no-deps . -w dist
          python -m venv /tmp/eval-lab-wheel
          /tmp/eval-lab-wheel/bin/pip install dist/*.whl
          /tmp/eval-lab-wheel/bin/pip check
          /tmp/eval-lab-wheel/bin/eval-ground-truth-lab --help
          /tmp/eval-lab-wheel/bin/python - <<'PY'
          from eval_ground_truth_lab.reports.html import render_html_report

          output = render_html_report(
              markdown_report="# installed wheel",
              canonical_markdown_path="report.md",
              run_artifact_path="run.json",
              title="wheel smoke",
              scope_label="packaging",
          )
          assert "installed wheel" in output
          PY

      - name: Mocked gdev-agent smoke
        run: python -m pytest tests/eval/test_gdev_agent_smoke.py tests/adapters/test_gdev_agent_adapter.py -q --tb=short

      - name: Trader Risk Audit sanitized replay
        run: |
          python -m eval_ground_truth_lab.cli run-trader-risk-audit-replay \
            --run-id trader-ci-synthetic-v1 \
            --run-dir /tmp/eval-lab-trader-ci-runs \
            --evidence-dir /tmp/eval-lab-trader-ci-evidence
          python -m eval_ground_truth_lab.cli verify-evidence \
            --manifest /tmp/eval-lab-trader-ci-evidence/sha256-*.manifest.json

      - name: Seeded smoke gate fixture
        run: |
          set +e
          python -m eval_ground_truth_lab.cli seeded-smoke \
            --dataset datasets/smoke/seeded_regressions.jsonl \
            --report reports/seeded-smoke.md
          status=$?
          set -e
          test "$status" -eq 1
