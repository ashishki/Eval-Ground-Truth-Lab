<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f4;
        color: #202124;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }
      header {
        border-bottom: 1px solid #d8d8d2;
        margin-bottom: 24px;
        padding-bottom: 20px;
      }
      h1 {
        font-size: 28px;
        line-height: 1.2;
        margin: 0 0 12px;
      }
      .scope {
        color: #4b5563;
        margin: 0 0 16px;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      a {
        color: #155e75;
        font-weight: 650;
      }
      pre {
        background: #ffffff;
        border: 1px solid #d8d8d2;
        border-radius: 6px;
        line-height: 1.5;
        margin: 0;
        overflow: auto;
        padding: 18px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>{{ title }}</h1>
        <p class="scope">{{ scope_label }}</p>
        <nav class="links" aria-label="Canonical artifacts">
          <a href="{{ canonical_markdown_path }}">Canonical markdown report</a>
          <a href="{{ run_artifact_path }}">Canonical run artifact</a>
        </nav>
      </header>
      <pre>{{ markdown_body }}</pre>
    </main>
  </body>
</html>
